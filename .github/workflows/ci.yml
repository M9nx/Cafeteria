name: CI

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'docs/**'
      - 'feat/**'
      - 'fix/**'
      - 'test/**'
  pull_request:
    branches:
      - main

jobs:
  php:
    name: PHP 8.4
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cafeteria_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_NAME: Cafeteria
      APP_ENV: test
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      APP_TIMEZONE: Africa/Cairo
      APP_CURRENCY: EGP
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cafeteria_test
      DB_USER: root
      DB_PASSWORD: root
      DB_CHARSET: utf8mb4

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint PHP
        run: composer lint

      - name: Run migrations
        run: composer migrate

      - name: Run tests
        run: composer test
